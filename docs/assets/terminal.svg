<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="Consolas, Menlo, monospace" font-size="13">
  <rect width="860" height="320" rx="10" fill="#0B1F1D"/>
  <rect width="860" height="34" rx="10" fill="#0F2E2B"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" fill="#5EEAD4" font-size="12">before a long run: are the commands it needs allowed?</text>
  <g fill="#D1FAF5">
    <text x="20" y="62"><tspan fill="#14B8A6">$</tspan> py -3 scripts/check_allowlist.py --commands run-commands.txt</text>
    <text x="20" y="92">7 command part(s) not allowlisted:</text>
    <text x="20" y="114">- [Bash] codex --version                    <tspan fill="#5EEAD4">-&gt; Bash(codex --version)</tspan></text>
    <text x="20" y="134">- [Bash] codex debug models                 <tspan fill="#5EEAD4">-&gt; Bash(codex debug *)</tspan></text>
    <text x="20" y="154">- [Bash] py -3 tests/run_tests.py           <tspan fill="#5EEAD4">-&gt; Bash(py -3 tests/run_tests.py)</tspan></text>
    <text x="20" y="174">- [Bash] git status -sb                     <tspan fill="#5EEAD4">-&gt; Bash(git status *)</tspan></text>
    <text x="20" y="194">- [Bash] git commit -m "feat(models): …"    <tspan fill="#5EEAD4">-&gt; Bash(git commit *)</tspan></text>
    <text x="20" y="214">- [Bash] git push origin feat/model-catalog <tspan fill="#5EEAD4">-&gt; Bash(git push origin feat/model-catalog)</tspan></text>
    <text x="20" y="234">- [Bash] py -3 -c "import sys,json; …"</text>
    <text x="20" y="254" fill="#FBBF24">    -&gt; no rule proposed (destructive or inline code) - keep the prompt</text>
    <text x="20" y="290" fill="#6B8F8B"># exit 1. Claude asks you once, up front, to approve the narrow rules - then runs without stalling.</text>
  </g>
</svg>
