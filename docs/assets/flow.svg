<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14B8A6"/></marker>
  </defs>
  <rect width="980" height="260" fill="#ffffff"/>
  <!-- before: a messy message -->
  <text x="30" y="34" fill="#0F2E2B" font-weight="bold" font-size="14">YOUR MESSAGE</text>
  <path d="M38 50h238a12 12 0 0 1 12 12v120a12 12 0 0 1-12 12H110l-26 22v-22H38a12 12 0 0 1-12-12V62a12 12 0 0 1 12-12z" fill="#fff" stroke="#0F2E2B" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#0F2E2B" font-size="12">
    <text x="44" y="78">done. here are the logs:</text>
    <text x="44" y="98" fill="#64748B" font-family="Consolas, monospace" font-size="11">ERROR bundling failed (44s)…</text>
    <text x="44" y="116" fill="#64748B" font-family="Consolas, monospace" font-size="11">WARN no route named "(auth)"…</text>
    <text x="44" y="138">if it all checks out, merge it?</text>
    <text x="44" y="158">also why do I need an API key?</text>
    <text x="44" y="178">and where is the log screen?</text>
  </g>
  <!-- arrow 1 -->
  <line x1="300" y1="122" x2="352" y2="122" stroke="#14B8A6" stroke-width="3" marker-end="url(#a)"/>
  <text x="326" y="110" text-anchor="middle" fill="#0F766E" font-size="11">hook</text>
  <!-- brief -->
  <text x="366" y="34" fill="#0F2E2B" font-weight="bold" font-size="14">THE BRIEF (shown, then work starts)</text>
  <rect x="366" y="50" width="300" height="160" rx="12" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <g font-size="12" fill="#0F2E2B">
    <text x="382" y="76"><tspan font-weight="bold">Goal</tspan>  fix the bundle error, answer 3 questions</text>
    <text x="382" y="98"><tspan font-weight="bold">Permission</tspan>  merge only if all tests pass</text>
    <text x="382" y="120"><tspan font-weight="bold">Tasks</tspan>  1. fix  2. test  3. merge  4. answer</text>
    <text x="382" y="142"><tspan font-weight="bold">Done</tspan>  suite green, merge commit exists</text>
    <text x="382" y="164"><tspan font-weight="bold">Stop only if</tspan>  a failure I can't explain</text>
    <text x="382" y="186"><tspan font-weight="bold">Report</tspan>  every question, one line each</text>
  </g>
  <!-- arrow 2 -->
  <line x1="678" y1="122" x2="730" y2="122" stroke="#14B8A6" stroke-width="3" marker-end="url(#a)"/>
  <text x="704" y="110" text-anchor="middle" fill="#0F766E" font-size="11">runs</text>
  <!-- report -->
  <text x="744" y="34" fill="#0F2E2B" font-weight="bold" font-size="14">THE REPORT</text>
  <rect x="744" y="50" width="218" height="160" rx="12" fill="#fff" stroke="#0F2E2B" stroke-width="2"/>
  <g font-size="12" fill="#0F2E2B">
    <text x="760" y="78"><tspan fill="#14B8A6" font-weight="bold">✓</tspan> bundle error fixed</text>
    <text x="760" y="102"><tspan fill="#14B8A6" font-weight="bold">✓</tspan> tests green, merged</text>
    <text x="760" y="126"><tspan fill="#14B8A6" font-weight="bold">✓</tspan> API key: needed for maps</text>
    <text x="760" y="150"><tspan fill="#14B8A6" font-weight="bold">✓</tspan> log screen: Settings → Logs</text>
    <text x="760" y="180" fill="#64748B" font-size="11">no question left behind</text>
  </g>
  <text x="490" y="246" text-anchor="middle" fill="#64748B" font-size="12">Short replies like "yes", "go" or "continue" skip all of this.</text>
</svg>
