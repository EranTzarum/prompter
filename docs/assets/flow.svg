<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker>
  </defs>
  <rect width="980" height="220" fill="#ffffff"/>
  <rect x="14" y="14" width="952" height="170" rx="12" fill="#f4f6fb" stroke="#9aa7c7"/>
  <text x="30" y="38" fill="#3b4a6b" font-weight="bold">EVERY SUBSTANTIAL MESSAGE, AFTER /prompter</text>
  <g font-size="12" fill="#1f2937">
    <rect x="30" y="54" width="140" height="110" rx="8" fill="#fff" stroke="#9aa7c7"/>
    <text x="100" y="74" text-anchor="middle" font-weight="bold">1 · You type</text>
    <text x="100" y="96" text-anchor="middle">long prompt,</text><text x="100" y="112" text-anchor="middle">pasted report,</text><text x="100" y="128" text-anchor="middle">or a question</text>
    <rect x="190" y="54" width="140" height="110" rx="8" fill="#fff" stroke="#9aa7c7"/>
    <text x="260" y="74" text-anchor="middle" font-weight="bold">2 · Hook</text>
    <text x="260" y="96" text-anchor="middle">flag on? substantial?</text><text x="260" y="112" text-anchor="middle">attach protocol.txt</text><text x="260" y="128" text-anchor="middle">as context</text>
    <rect x="350" y="54" width="140" height="110" rx="8" fill="#fff" stroke="#9aa7c7"/>
    <text x="420" y="74" text-anchor="middle" font-weight="bold">3 · Brief</text>
    <text x="420" y="96" text-anchor="middle">goal · permission</text><text x="420" y="112" text-anchor="middle">tasks · done</text><text x="420" y="128" text-anchor="middle">stop-if · report</text>
    <rect x="510" y="54" width="140" height="110" rx="8" fill="#fff" stroke="#9aa7c7"/>
    <text x="580" y="74" text-anchor="middle" font-weight="bold">4 · Allowlist</text>
    <text x="580" y="96" text-anchor="middle">long run only:</text><text x="580" y="112" text-anchor="middle">check_allowlist.py</text><text x="580" y="128" text-anchor="middle">one question up front</text>
    <rect x="670" y="54" width="140" height="110" rx="8" fill="#fff" stroke="#9aa7c7"/>
    <text x="740" y="74" text-anchor="middle" font-weight="bold">5 · Execute</text>
    <text x="740" y="96" text-anchor="middle">to the end,</text><text x="740" y="112" text-anchor="middle">stop only on named</text><text x="740" y="128" text-anchor="middle">conditions → report</text>
    <g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
      <line x1="170" y1="109" x2="190" y2="109"/><line x1="330" y1="109" x2="350" y2="109"/><line x1="490" y1="109" x2="510" y2="109"/><line x1="650" y1="109" x2="670" y2="109"/>
    </g>
  </g>
  <rect x="826" y="54" width="130" height="110" rx="12" fill="#fff7ed" stroke="#f0883e"/>
  <text x="891" y="80" text-anchor="middle" fill="#9a3412" font-weight="bold" font-size="12">passes through</text>
  <text x="891" y="104" text-anchor="middle" fill="#1f2937" font-size="12">yes · go · continue</text>
  <text x="891" y="120" text-anchor="middle" fill="#1f2937" font-size="12">/other-commands</text>
  <text x="891" y="136" text-anchor="middle" fill="#1f2937" font-size="12">prompter off</text>
</svg>
